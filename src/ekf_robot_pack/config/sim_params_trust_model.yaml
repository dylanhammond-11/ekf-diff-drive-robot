# All Parameters for easy access to change

/**: # Global parameter: robot base sampling frequency (control and IMU, encoder)
  ros__parameters:
    rate_hz: 50.0
    waypoints_flat: [0.0, 0.0, 1.0, 0.0, 1.0, 1.0, 0.0, 1.0, 0.0, 2.0, 1.0, 2.0]

controller_node:
  ros__parameters:
    kv: 1.0  # Gain for velocity (v) controller
    kw: 1.5  # Gain for angular velocity (w) controller
    

ekf_node:
  ros__parameters:
    q_diag: [0.0001, 0.0001, 0.0001]
    r_diag: [0.012, 0.012]  
    p0_diag: [0.05, 0.05, 0.05]
    predict_rate_hz: 50.0

imu_node:
  ros__parameters:
    imu_noise_std: 0.08   # rad/s


encoder_node:
  ros__parameters:
    enc_noise_std: 0.05   # m/s


gps_node:
  ros__parameters:
    gps_noise_std: 0.10   # meters
    gps_hz: 5.0 # Hz
